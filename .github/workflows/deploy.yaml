name: Deploy Quartz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org

      - name: Install Quartz plugins
        run: npm run install-plugins

      - name: Build Quartz
        run: npx quartz build -d content -v

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload site artifact for Aliyun
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 1

  # 国内站点：阿里云 OSS + ESA
  # 需要仓库变量 ALIYUN_DEPLOY=true 和以下 Secrets：
  # ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET / ALIYUN_OSS_BUCKET
  # / ALIYUN_OSS_ENDPOINT / ALIYUN_CDN_DOMAIN / ALIYUN_ESA_SITE_ID
  publish-aliyun:
    needs: build
    if: vars.ALIYUN_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - name: Install ossutil
        run: |
          curl -sSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil --version

      - name: Upload to Aliyun OSS
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          cat > "$HOME/.ossutilconfig" <<EOF
          [Credentials]
          language=EN
          endpoint=$ALIYUN_OSS_ENDPOINT
          accessKeyID=$ALIYUN_ACCESS_KEY_ID
          accessKeySecret=$ALIYUN_ACCESS_KEY_SECRET
          EOF
          ossutil rm "oss://$ALIYUN_OSS_BUCKET" -r -f || true
          ossutil cp -r public/ "oss://$ALIYUN_OSS_BUCKET/" --update

      - name: Purge ESA cache
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_ESA_SITE_ID: ${{ secrets.ALIYUN_ESA_SITE_ID }}
          ALIYUN_CDN_DOMAIN: ${{ secrets.ALIYUN_CDN_DOMAIN }}
        run: |
          set -euo pipefail
          curl -sSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar -xzf aliyun-cli.tgz
          ./aliyun configure set --profile default --mode AK \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET" \
            --region cn-hangzhou
          ./aliyun esa PurgeCaches \
            --region cn-hangzhou \
            --SiteId "$ALIYUN_ESA_SITE_ID" \
            --Type directory \
            --Content "{\"Directories\":[\"https://$ALIYUN_CDN_DOMAIN/\"]}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
